<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JobReady — Perfil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar" data-active="perfil"></aside>
  <main class="main">
    <div class="page-header">
      <div>
        <h1>Perfil</h1>
        <p>Gerenciamento do seu perfil da plataforma.</p>
      </div>
    </div>

    <div class="alert" id="crud-alert" style="display:none;"></div>

    <table id="crud-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nome</th>
          <th>E-mail</th>
          <th>Criado em</th>
          <th></th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <div class="empty-state" id="empty-state" style="display:none;">Nenhum registro cadastrado ainda.</div>

    <div class="modal-backdrop" id="crud-modal-backdrop">
      <div class="modal">
        <h2 id="crud-modal-title">Novo Usuário</h2>
        <form id="crud-form">
          <div class="field">
            <label>Nome</label>
            <input type="text" name="nome" required>
          </div>
          <div class="field">
            <label>E-mail</label>
            <input type="email" name="email" required>
          </div>
          <div class="field">
            <label>Senha</label>
            <input type="password" name="senha" required>
          </div>

          <div class="modal-actions">
            <button type="button" class="btn btn-secondary" id="btn-cancelar">Cancelar</button>
            <button type="submit" class="btn btn-primary">Salvar</button>
          </div>
        </form>
      </div>
    </div>
  </main>
</div>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/nav.js"></script>
<script src="js/crud.js"></script>
<script>
initCrudPage({
  resourcePath: "/api/usuarios",
  singular: "Usuário",
  columns: [
    { key: "id", label: "ID" },
    { key: "nome", label: "Nome" },
    { key: "email", label: "E-mail" },
    { key: "criado_em", label: "Criado em" }
  ],
  fields: [
    { name: "nome", type: "text" },
    { name: "email", type: "email" },
    { name: "senha", type: "password" }
  ],
});
</script>
</body>
</html>
