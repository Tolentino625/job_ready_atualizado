<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JobReady — Feedbacks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar" data-active="feedbacks"></aside>
  <main class="main">
    <div class="page-header">
      <div>
        <h1>Feedbacks</h1>
        <p>Feedback de desempenho gerado ao final de cada entrevista.</p>
      </div>
      <button class="btn btn-primary" id="btn-novo">+ Novo</button>
    </div>

    <div class="alert" id="crud-alert" style="display:none;"></div>

    <table id="crud-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>ID da entrevista</th>
          <th>Pontuação</th>
          <th>Ponto forte</th>
          <th></th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <div class="empty-state" id="empty-state" style="display:none;">Nenhum registro cadastrado ainda.</div>

    <div class="modal-backdrop" id="crud-modal-backdrop">
      <div class="modal">
        <h2 id="crud-modal-title">Novo Feedback</h2>
        <form id="crud-form">
          <div class="field">
            <label>ID da entrevista</label>
            <input type="number" name="entrevista_id" required>
          </div>
          <div class="field">
            <label>Pontuação (0-10)</label>
            <input type="number" name="pontuacao" required>
          </div>
          <div class="field">
            <label>Comentário</label>
            <textarea name="comentario"></textarea>
          </div>
          <div class="field">
            <label>Ponto forte</label>
            <input type="text" name="ponto_forte">
          </div>
          <div class="field">
            <label>Ponto a melhorar</label>
            <input type="text" name="ponto_a_melhorar">
          </div>

          <div class="modal-actions">
            <button type="button" class="btn btn-secondary" id="btn-cancelar">Cancelar</button>
            <button type="submit" class="btn btn-primary">Salvar</button>
          </div>
        </form>
      </div>
    </div>
  </main>
</div>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/nav.js"></script>
<script src="js/crud.js"></script>
<script>
initCrudPage({
  resourcePath: "/api/feedbacks",
  singular: "Feedback",
  columns: [
    { key: "id", label: "ID" },
    { key: "entrevista_id", label: "ID da entrevista" },
    { key: "pontuacao", label: "Pontuação" },
    { key: "ponto_forte", label: "Ponto forte" }
  ],
  fields: [
    { name: "entrevista_id", type: "number" },
    { name: "pontuacao", type: "number" },
    { name: "comentario", type: "textarea" },
    { name: "ponto_forte", type: "text" },
    { name: "ponto_a_melhorar", type: "text" }
  ],
});
</script>
</body>
</html>
